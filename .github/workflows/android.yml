name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Preparar SDK Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '13114758' # 19.0, compatível com Java 17
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Compilar, testar e executar lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Guardar relatórios de validação
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorios-android
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Testar diagnóstico isolado no PowerShell
        shell: pwsh
        run: .\scripts\tests\Test-Diagnostics.ps1
      - name: Testar compatibilidade com Windows PowerShell
        shell: powershell
        run: .\scripts\tests\Test-Diagnostics.ps1
      - name: Verificar sintaxe do roteiro de emulador
        shell: pwsh
        run: |
          $syntaxTokens = $null
          $syntaxErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/Test-WearEmulator.ps1", [ref]$syntaxTokens, [ref]$syntaxErrors
          ) | Out-Null
          if ($syntaxErrors.Count -gt 0) { throw ($syntaxErrors | Out-String) }
